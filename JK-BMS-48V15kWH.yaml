substitutions:
  name: jk-bms-48v15kwh
  device_description: "Monitor and control JK-BMS v19 via bluetooth"
  external_components_source: github://C00L4LIFE/esphome-jk-bms@main
  # Please use "JK02_24S" if you own a old JK-BMS < hardware version 11.0 (hardware version >= 6.0 and < 11.0)
  # Please use "JK02_32S" if you own a new JK-BMS >= hardware version 11.0 (f.e. JK-B2A8S20P hw 11.XW, sw 11.26)
  # Please use "JK04" if you have some old JK-BMS <= hardware version 3.0 (f.e. JK-B2A16S hw 3.0, sw. 3.3.0)
  bms_protocol_version: JK02_32S
  # Domaine DNS local (voir wifi: domain: plus bas et le capteur "hostname")
  dns_domain: ".internal"

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-jk-bms"
    version: 3.0.0
  devices:
    - id: device0
      name: "${name}"
  on_boot:
    # Restauration immédiate des compteurs d'énergie depuis la NVS (copie
    # locale) : les totaux sont corrects dès le boot, même si Home Assistant
    # est injoignable. La valeur du helper HA, quand elle arrive, ne peut que
    # relever l'offset (fusion max, voir les imports homeassistant plus bas).
    priority: -100
    then:
      - lambda: |-
          id(pin_offset) = id(nvs_pin);
          id(pout_offset) = id(nvs_pout);

# Sauvegarde NVS des compteurs : écriture au plus toutes les 6 h (4/jour,
# usure négligeable sur des décennies) + flush automatique à chaque reboot
# propre (OTA, restart) par le syncer de préférences. La flash n'est donc
# sollicitée que rarement, contrairement à une persistance à la seconde.
preferences:
  flash_write_interval: 6h

esp32:
  #board: wemos_d1_mini32
  variant: esp32
  framework:
    type: esp-idf

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # Suffixe DNS local du réseau (routeur OPNsense) : les noms d'hôtes locaux
  # sont servis par Unbound en ".internal", ".local" restant réservé au
  # mDNS/Bonjour. Les outils ESPHome (OTA, logs, détection "en ligne" du
  # dashboard) viseront donc "jk-bms.internal". Le composant mdns: reste actif
  # par défaut : ".local" continue de répondre sur le même sous-réseau.
  # Prérequis côté routeur : bail DHCP statique + enregistrement du nom dans
  # Unbound (host override "jk-bms" / domaine "internal").
  domain: ${dns_domain}

ota:
  platform: esphome
  on_begin:
    then:
      - switch.turn_off: ble_client_switch
      - logger.log: "BLE connection suspended for OTA update"

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO

# If you don't use Home Assistant please remove this `api` section and uncomment the `mqtt` component!
api:
  encryption:
    key: !secret api_encryption_key

# Mémoire réseau des compteurs d'énergie cumulés (energy in/out total) : rien
# n'est persisté en flash (vieillissement NVS). Le stockage est fait dans
# 2 helpers input_number de Home Assistant (jamais "unavailable", contrairement
# aux entités du device qui perdent leur état à chaque reboot) :
#   input_number.jk_bms_energy_in    input_number.jk_bms_energy_out
# L'ESP les met à jour toutes les 30 s par appel de service (nécessite
# d'autoriser le device à exécuter des actions HA : Paramètres > Appareils >
# ESPHome > jk-bms > Configurer > "Allow the device to perform actions").
# Au boot, il relit le helper (import ci-dessous) et restaure l'offset en
# one-shot. Pas de composant MQTT : ses ~150 wrappers d'entités obligatoires
# épuisaient le heap (crash LoadProhibited + échecs de handshake WiFi).
interval:
  # Toutes les 30 s : (1) copie du total dans la variable NVS — sans garde,
  # car l'offset intègre déjà l'historique NVS dès le boot, le total courant
  # est donc toujours >= à la valeur stockée ; l'écriture flash réelle reste
  # limitée par flash_write_interval (6 h) ou au shutdown. (2) Miroir vers les
  # helpers HA, gardé par les flags "restored" pour ne jamais écraser la
  # mémoire réseau avec un compteur repartant de zéro avant restauration.
  - interval: 30s
    then:
      - lambda: |-
          auto keep = [](float &dst, float v) { if (std::isfinite(v)) dst = v; };
          keep(id(nvs_pin), id(bms_energy_in_total).state);
          keep(id(nvs_pout), id(bms_energy_out_total).state);
      - if:
          condition:
            lambda: 'return id(pin_restored) && id(pout_restored);'
          then:
            - homeassistant.action:
                action: input_number.set_value
                data:
                  entity_id: input_number.jk_bms_energy_in
                  value: !lambda |-
                    char buf[32];
                    snprintf(buf, sizeof(buf), "%.2f", id(bms_energy_in_total).state);
                    return std::string(buf);
            - homeassistant.action:
                action: input_number.set_value
                data:
                  entity_id: input_number.jk_bms_energy_out
                  value: !lambda |-
                    char buf[32];
                    snprintf(buf, sizeof(buf), "%.2f", id(bms_energy_out_total).state);
                    return std::string(buf);

# Built-in dashboard to view and control all entities below from a browser, f.e. http://jk-bms.internal
web_server:
  version: 3

# Needed for the "charge/discharge finish time" text sensors below. SNTP works standalone
# (WiFi + internet only). If you use Home Assistant you can use its clock instead:
#   - platform: homeassistant
#     id: rtc_time
time:
  - platform: sntp
    id: rtc_time
    timezone: America/Port-au-Prince

esp32_ble_tracker:
  scan_parameters:
    active: false

ble_client:
  - mac_address: !secret bms1_mac_address
    id: client

jk_bms_ble:
  - ble_client_id: client
    protocol_version: ${bms_protocol_version}
    throttle: 5s
    id: bms
    time_id: rtc_time

binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms
    balancing:
      name: "balancing"
    charging:
      name: "charging"
    discharging:
      name: "discharging"
    heating:
      name: "heating"
    online_status:
      name: "online status"
    dry_contact_1:
      name: "dry contact 1"
    dry_contact_2:
      name: "dry contact 2"

  # Capteur réseau : connectivité du module lui-même, vue par
  # Home Assistant / le serveur web embarqué.
  - platform: status
    name: "network status"

button:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms
    retrieve_settings:
      name: "retrieve settings"
    retrieve_device_info:
      name: "retrieve device info"
    retrieve_logbook:
      name: "retrieve logbook"
    shutdown:
      name: "shutdown"
    restart:
      name: "restart"
    factory_reset:
      name: "factory reset"

  # Remise à zéro des compteurs d'énergie cumulés (energy in/out total).
  # L'offset devient l'opposé de l'accumulé C++ courant (le total retombe à 0
  # sans redémarrer le module) et les helpers HA sont immédiatement remis à 0
  # pour que l'ancienne valeur ne revienne pas au prochain boot.
  - platform: template
    name: "reset energy counters"
    entity_category: config
    icon: "mdi:counter"
    on_press:
      - lambda: |-
          float in_raw = id(bms_energy_in_raw).state;
          float out_raw = id(bms_energy_out_raw).state;
          id(pin_offset) = isnan(in_raw) ? 0 : -in_raw;
          id(pout_offset) = isnan(out_raw) ? 0 : -out_raw;
          id(pin_restored) = true;
          id(pout_restored) = true;
          id(nvs_pin) = 0;
          id(nvs_pout) = 0;
          global_preferences->sync();
          id(bms_energy_in_total).update();
          id(bms_energy_out_total).update();
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.jk_bms_energy_in
            value: "0"
      - homeassistant.action:
          action: input_number.set_value
          data:
            entity_id: input_number.jk_bms_energy_out
            value: "0"

# Tables circulaires du lissage de puissance batterie (une seule table maintenant).
# Implémentée à la main (plutôt que sliding_window_moving_average) parce que la 
# taille de fenêtre et l'intervalle du filtre ESPHome sont figés à la compilation, 
# alors qu'ici ils sont réglables à chaud via les numbers "Batterie Lissage ..." ci-dessous.
globals:
  - id: pw_avg_buffer
    type: float[100]
  - id: pw_avg_idx
    type: int
    initial_value: '0'
  - id: pw_avg_count
    type: int
    initial_value: '0'
  - id: pw_avg_last_ms
    type: uint32_t
    initial_value: '0'
  # Persistance réseau des compteurs d'énergie : offset = valeur restaurée du
  # broker MQTT au boot (peut devenir négatif après un reset), restored = flag
  # one-shot pour n'accepter que le premier message retenu après démarrage.
  - id: pin_offset
    type: float
    initial_value: '0'
  - id: pout_offset
    type: float
    initial_value: '0'
  - id: pin_restored
    type: bool
    initial_value: 'false'
  - id: pout_restored
    type: bool
    initial_value: 'false'
  # Copie NVS des totaux (2e source de mémoire, locale). Mise à jour en RAM
  # toutes les 30 s ; l'écriture flash réelle n'a lieu qu'aux 6 h (voir
  # preferences:) ou au shutdown propre. restore_value la recharge au boot.
  - id: nvs_pin
    type: float
    restore_value: true
    initial_value: '0'
  - id: nvs_pout
    type: float
    restore_value: true
    initial_value: '0'

number:
  - platform: jk_bms_ble
    jk_bms_ble_id: bms
    balance_trigger_voltage:
      name: "balance trigger voltage"
    cell_count:

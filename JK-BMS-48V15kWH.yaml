      name: "uart1 protocols enabled bitmask"
    uart2_protocols_enabled_bitmask:
      name: "uart2 protocols enabled bitmask"
    uart3_protocols_enabled_bitmask:
      name: "uart3 protocols enabled bitmask"
    can_protocols_enabled_bitmask:
      name: "can protocols enabled bitmask"

  # Puissance signée (+ = charge) lissée sur la table circulaire : une
  # lecture par intervalle dans la case 0..99 (retour à 0 après 99), moyenne =
  # somme des cases / nombre de cases ; tant que la table n'est pas pleine,
  # seules les cases alimentées comptent.
  - platform: template
    name: "power average"
    id: bms_power_avg
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      float v = id(bms_power).state;
      if (isnan(v)) return {};
      uint32_t now = millis();
      uint32_t interval_ms = (uint32_t) id(pw_avg_interval).state * 1000;
      if (interval_ms < 1000) interval_ms = 1000;
      if (id(pw_avg_count) > 0 && (now - id(pw_avg_last_ms)) < interval_ms)
        return {};  // pas encore l'heure d'échantillonner
      id(pw_avg_last_ms) = now;
      id(pw_avg_buffer)[id(pw_avg_idx)] = v;
      id(pw_avg_idx) = (id(pw_avg_idx) + 1) % 100;
      if (id(pw_avg_count) < 100)
        id(pw_avg_count) += 1;
      int window = (int) id(pw_avg_window).state;
      if (window < 1) window = 1;
      if (window > 100) window = 100;
      int n = id(pw_avg_count) < window ? id(pw_avg_count) : window;
      float sum = 0;
      int pos = id(pw_avg_idx);
      for (int i = 0; i < n; i++) {
        pos = (pos + 99) % 100;  // recule d'une case (les n plus récentes)
        sum += id(pw_avg_buffer)[pos];
      }
      return sum / n;

  # Restauration réseau : import des helpers input_number de HA (2e source de
  # mémoire). One-shot par compteur — seule la première valeur valide reçue
  # après démarrage est fusionnée ; les mises à jour suivantes (dont l'écho de
  # notre propre miroir 30 s) sont ignorées. Fusion par max() avec l'offset
  # déjà restauré de la NVS au boot : la valeur HA ne peut que relever le
  # total, jamais le faire reculer ni le doubler.
  - platform: homeassistant
    id: ha_pin
    entity_id: input_number.jk_bms_energy_in
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(pin_restored)) return;
            if (!std::isfinite(x) || x < 0) return;
            id(pin_offset) = std::max(id(pin_offset), x);
            id(pin_restored) = true;
  - platform: homeassistant
    id: ha_pout
    entity_id: input_number.jk_bms_energy_out
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(pout_restored)) return;
            if (!std::isfinite(x) || x < 0) return;
            id(pout_offset) = std::max(id(pout_offset), x);
            id(pout_restored) = true;

  # Compteurs d'énergie cumulés persistants : total = offset restauré du helper
  # HA (mémoire réseau) + accumulé C++ depuis le boot. Le capteur brut repart
  # de 0 à chaque redémarrage, l'offset absorbe l'historique : le total ne
  # recule jamais (clamp >= 0, reset explicite via les boutons ci-dessous).
  - platform: template
    name: "energy in total"
    id: bms_energy_in_total
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float raw = id(bms_energy_in_raw).state;
      if (isnan(raw)) raw = 0;
      float total = id(pin_offset) + raw;
      return total < 0 ? 0 : total;
  - platform: template
    name: "energy out total"
    id: bms_energy_out_total
    unit_of_measurement: Wh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      float raw = id(bms_energy_out_raw).state;
      if (isnan(raw)) raw = 0;
      float total = id(pout_offset) + raw;
      return total < 0 ? 0 : total;

